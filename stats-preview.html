<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>EuroScout · Player Stats preview</title><link rel="stylesheet" href="euroscout-stats.css"><style>body{margin:0;background:#f2f6f4;color:#122b3a;font-family:Arial,sans-serif}.preview-head{height:65px;background:#075c3c;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.preview-head strong{font-size:22px}.preview-head button{background:transparent;color:inherit;border:1px solid #87aa96;border-radius:8px;padding:8px;cursor:pointer}#app{padding:24px;max-width:1680px;margin:auto}html[data-theme=dark] body{background:#101b20;color:#e5eeeb}html[data-theme=dark]{--panel:#17272c;--panel2:#203238;--txt:#e5eeeb;--muted:#a5b6b0;--line:#365052;--bg:#101b20;--green:#61c693;--soft:#244c3a}</style></head><body><header class="preview-head"><strong>EuroScout <small style="font-size:12px">Stats workspace · local preview</small></strong><button id="previewTheme">Light / dark</button></header><main id="app"></main><script>window.EUROSCOUT_STATS_CONFIG={endpoint:'/stats-api',preview:true};document.querySelector('#previewTheme').onclick=()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';</script><script src="euroscout-stats.js"></script><script>ESStats.mount(document.querySelector('#app'));</script></body></html>
